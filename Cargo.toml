# The overlay (this package), its input daemon (crates/retrobox-inputd) and
# what both share (crates/retrobox-input). One version for all: the packaging
# script writes it into the first "version" line, the workspace's.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-2.0-only"
authors = ["Manu Romero <manu4.2012@gmail.com>"]
repository = "https://github.com/RetroboxProject/retrobox-overlay"

[workspace]
members = ["crates/retrobox-input", "crates/retrobox-inputd"]
default-members = [".", "crates/retrobox-input", "crates/retrobox-inputd"]

[workspace.dependencies]
retrobox-input = { path = "crates/retrobox-input" }
anyhow = "1"
calloop = { version = "0.14", features = ["signals"] }
env_logger = { version = "0.11", default-features = false }
evdev = "0.13"
log = "0.4"
nix = { version = "0.31", features = ["signal", "fs", "process", "user", "inotify", "poll", "term"] }
roxmltree = "0.21"
rust-ini = "0.21"
rustix = { version = "1", features = ["process"] }
serde_json = { version = "1", features = ["raw_value"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# pixel and layout arithmetic converts between integer and float sizes all the time
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

[package]
name = "retrobox-overlay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "In-game overlay menu for Retrobox, styled like its EmulationStation theme"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["retrobox", "emulation", "overlay", "wayland", "emulationstation"]
categories = ["games", "gui"]

[dependencies]
retrobox-input.workspace = true
anyhow.workspace = true
calloop.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock", "unstable-locales"] }
cosmic-text = "0.19"
env_logger.workspace = true
evdev.workspace = true
fluent-bundle = "0.16"
log.workspace = true
nix.workspace = true
resvg = { version = "0.49", default-features = false }
roxmltree.workspace = true
rust-ini.workspace = true
rustix = { workspace = true, features = ["param"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
smithay-client-toolkit = "0.21"
tiny-skia = "0.12"
unic-langid = "0.9"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
x11rb = { version = "0.14", default-features = false, features = ["randr"] }
xkbcommon = "0.8"
zune-jpeg = "0.5"

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.deb]
maintainer = "Manu Romero <manu4.2012@gmail.com>"
copyright = "Manu Romero"
license-file = ["LICENSE", "0"]
section = "games"
priority = "optional"
# $auto: the shared libraries the binary links (libc, libxkbcommon);
# retrobox-emulationstation: its theme export and its help icons, read at
# run time; retrobox-core: the launcher's control channel, retrobox-emukill
depends = "$auto, retrobox-core, retrobox-emulationstation"
# pdftoppm and pdfinfo, for the games' manuals
recommends = "poppler-utils"
# the volume and the audio page (wpctl and pw-dump / pactl), the menu's sounds
# (pw-play / paplay), a backlight without logind (brightnessctl)
suggests = "wireplumber, pipewire-bin | pulseaudio-utils, brightnessctl"
extended-description = """\
Retrobox's in-game menu: opened by holding the controller's hotkey or Shift+F7, it
shows a side menu over the dimmed game, drawn with the active EmulationStation
theme's menu style, and a clock. Needs a Wayland compositor with layer-shell
(KWin, labwc and other wlroots compositors)."""
assets = [
    ["target/release/retrobox-overlay", "usr/bin/", "755"],
    ["target/release/retrobox-inputd", "usr/bin/", "755"],
    ["data/retrobox-inputd.service", "usr/lib/systemd/user/", "644"],
    ["README.md", "usr/share/doc/retrobox-overlay/", "644"],
    ["data/overlay.ini", "usr/share/doc/retrobox-overlay/overlay.ini.example", "644"],
]

[package.metadata.generate-rpm]
license = "GPL-2.0-only"
assets = [
    { source = "target/release/retrobox-overlay", dest = "/usr/bin/retrobox-overlay", mode = "755" },
    { source = "target/release/retrobox-inputd", dest = "/usr/bin/retrobox-inputd", mode = "755" },
    { source = "data/retrobox-inputd.service", dest = "/usr/lib/systemd/user/retrobox-inputd.service", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/retrobox-overlay/README.md", mode = "644", doc = true },
    { source = "data/overlay.ini", dest = "/usr/share/doc/retrobox-overlay/overlay.ini.example", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/retrobox-overlay/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
# as the deb: ES's theme export and help icons, the core's control channel
retrobox-core = "*"
retrobox-emulationstation = "*"
libxkbcommon = "*"

[package.metadata.generate-rpm.recommends]
# pdftoppm and pdfinfo, for the games' manuals
poppler-utils = "*"
