[package]
name = "retrobox-overlay"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "In-game overlay menu for Retrobox, styled like its EmulationStation theme"
license = "GPL-2.0-only"
authors = ["Manu Romero <manu4.2012@gmail.com>"]
repository = "https://github.com/RetroboxProject/retrobox-overlay"
readme = "README.md"
keywords = ["retrobox", "emulation", "overlay", "wayland", "emulationstation"]
categories = ["games", "gui"]

[dependencies]
anyhow = "1"
calloop = { version = "0.14", features = ["signals"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "unstable-locales"] }
cosmic-text = "0.19"
env_logger = { version = "0.11", default-features = false }
evdev = "0.13"
fluent-bundle = "0.16"
log = "0.4"
nix = { version = "0.31", features = ["signal", "fs", "process", "user", "inotify"] }
resvg = { version = "0.49", default-features = false }
roxmltree = "0.21"
rust-ini = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = "0.21"
tiny-skia = "0.12"
unic-langid = "0.9"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
x11rb = { version = "0.14", default-features = false, features = ["randr"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# pixel and layout arithmetic converts between integer and float sizes all the time
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.deb]
maintainer = "Manu Romero <manu4.2012@gmail.com>"
copyright = "Manu Romero"
license-file = ["LICENSE", "0"]
section = "games"
priority = "optional"
# $auto: the shared libraries the binary links (libc, libxkbcommon);
# retrobox-emulationstation: its theme export and its help icons, read at
# run time; retrobox-core: the launcher's control channel, retrobox-emukill
depends = "$auto, retrobox-core, retrobox-emulationstation"
# pdftoppm and pdfinfo, for the games' manuals
recommends = "poppler-utils"
extended-description = """\
Retrobox's in-game menu: opened by holding the controller's hotkey or Shift+F7, it
shows a side menu over the dimmed game, drawn with the active EmulationStation
theme's menu style, and a clock. Needs a Wayland compositor with layer-shell
(KWin, labwc and other wlroots compositors)."""
assets = [
    ["target/release/retrobox-overlay", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/retrobox-overlay/", "644"],
    ["data/overlay.ini", "usr/share/doc/retrobox-overlay/overlay.ini.example", "644"],
]

[package.metadata.generate-rpm]
license = "GPL-2.0-only"
assets = [
    { source = "target/release/retrobox-overlay", dest = "/usr/bin/retrobox-overlay", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/retrobox-overlay/README.md", mode = "644", doc = true },
    { source = "data/overlay.ini", dest = "/usr/share/doc/retrobox-overlay/overlay.ini.example", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/retrobox-overlay/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
# as the deb: ES's theme export and help icons, the core's control channel
retrobox-core = "*"
retrobox-emulationstation = "*"
libxkbcommon = "*"

[package.metadata.generate-rpm.recommends]
# pdftoppm and pdfinfo, for the games' manuals
poppler-utils = "*"
