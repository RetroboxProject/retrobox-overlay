name: build

# Builds and tests retrobox-overlay (.deb and .rpm, amd64 and arm64).
# A push to main publishes the rolling "continuous" pre-release, versioned
# X.Y.Z.<UTC timestamp> (above the last release, below the next one), so it
# installs over the previous build. Real releases are manual: run this
# workflow with a tag (e.g. v0.2.2). Pull requests only build and test.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish (e.g. v0.2.2). Empty = build only.'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark the release as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Choose the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          if [[ -n "${REQUESTED}" ]]; then
            [[ "${REQUESTED}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] \
              || { echo "bad version: ${REQUESTED}" >&2; exit 1; }
            version="${REQUESTED}"
          elif [[ "${GITHUB_EVENT_NAME}" == push ]]; then
            version="$(bash .github/scripts/continuous-version.sh .)"
          else
            version=""
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Version: ${version:-<Cargo.toml>}"

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      # Pinned: every Rust release adds clippy lints, and with -D warnings an
      # untouched tree would start failing. Bump it on purpose, fixing the new
      # lints in the same commit.
      - uses: dtolnay/rust-toolchain@1.99
        with: { components: "clippy, rustfmt" }
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  package:
    needs: version
    # Built in Debian 12 so the binary needs no newer glibc than Debian 12 /
    # Ubuntu 24.04 / current Fedora have; the .rpm packs the same binary.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    steps:
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config libxkbcommon-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-deb,cargo-generate-rpm" }
      # The packaging lives in scripts/package.sh, so it can be run by hand too.
      # An empty version (pull request) keeps the version of Cargo.toml.
      - name: Build the .deb and the .rpm
        env:
          VERSION_INPUT: ${{ needs.version.outputs.version }}
        run: bash scripts/package.sh --version "${VERSION_INPUT}" --outdir dist
      - uses: actions/upload-artifact@v4
        with: { name: "packages-${{ matrix.arch }}", path: dist/* }

  smoke-deb:
    needs: package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:bookworm", "debian:trixie", "ubuntu:24.04"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: packages-amd64, path: dist }
      # retrobox-core and retrobox-emulationstation are not in the distro: only
      # the binary and its shared libraries are checked here
      - run: |
          apt-get update && apt-get install -y libxkbcommon0
          dpkg -i --force-depends dist/*.deb
          retrobox-overlay --version
          retrobox-overlay --help >/dev/null

  smoke-rpm:
    needs: package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        fedora: ["42", "43", "44"]
    container: fedora:${{ matrix.fedora }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: packages-amd64, path: dist }
      - run: |
          dnf install -y libxkbcommon
          rpm -i --nodeps dist/*.rpm
          retrobox-overlay --version
          retrobox-overlay --help >/dev/null

  publish:
    if: github.event_name == 'push' || inputs.version != ''
    needs: [version, check, package, smoke-deb, smoke-rpm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      # Both modes regenerate SHA256SUMS (bare names), which the installer and
      # retrobox-update verify.
      - name: Publish the continuous pre-release
        if: inputs.version == ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: .github/scripts/publish-release.sh continuous dist "${VERSION}"
      - name: Publish the release
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease && '--prerelease' || '' }}
        # PRERELEASE is intentionally unquoted: empty means no argument.
        # shellcheck disable=SC2086
        run: .github/scripts/publish-release.sh tag "${TAG}" dist ${PRERELEASE}
