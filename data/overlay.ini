; retrobox-overlay settings. Copy to ~/.config/retrobox/overlay.ini (or
; /etc/retrobox/overlay.ini for every user) and keep only what you change:
; every key has the default shown here.

[overlay]
; edge the menu slides from: right | left
side = right
; opacity of the black layer over the game, 0 to 1
dim = 0.6
; length of the opening animation, in milliseconds (0: none)
animation_ms = 150
; how long the hotkey (or Select+A without one) is held to open the overlay, in
; milliseconds (300 to 3000)
hold_ms = 750
; icons next to the menu entries
icons = true

[clock]
; the clock: big (time and date on the other side of the screen, aligned to
; its edge) or small (the time in the menu's status line, next to the
; network and the battery)
enabled = true
size = big
; strftime formats (chrono); day and month names follow the language.
; Empty: the language's own, e.g. "%A, %-d de %B de %Y" in Spanish.
time_format =
date_format =
; the small clock's strftime format. Empty: the language's own ("%H:%M",
; or "%-I:%M %p" where EmulationStation shows a 12-hour clock)
small_format =
; top | center | bottom (the big clock)
position = top
; RRGGBB or RRGGBBAA (the big clock)
color = FFFFFFFF

[status]
; the battery's percentage next to its icon (computers with a battery)
battery_percent = true

[system]
; offer to put the computer to sleep, outside games
standby = true

[manual]
; who zooms and crops the manual's page: compositor (wp_viewporter: no
; drawing on every move) | overlay (for compositors that show scaled
; buffers wrong, such as wlroots 0.17's software renderer)
scaling = compositor
